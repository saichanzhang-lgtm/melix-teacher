<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7A6CF5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Melix Teacher">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="icon" type="image/png" href="/logo.png">
<title>Melix Teacher — AI Teaching Workspace</title>
<style>
:root{--pri:#7A6CF5;--pri-light:#F0ECFD;--pri-dark:#5A4BD4;--pri-hover:#F7F4FF;--pri-active-bg:#EDE9FD;--pri-active-border:#CFC5F8;--pri-active-text:#5A4BD4;--accent:#47C4B8;--accent-light:#EDFAF8;--bg:#F8F8FA;--surface:#FFFFFF;--text:#1F2430;--text2:#8B8FA0;--border:#EAEBF0;--shadow:0 1px 2px rgba(0,0,0,.04);--radius:12px;--radius-sm:8px;--input-bg:#F5F5F7;--success:#47C4B8;--nav-w:300px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}

.app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
.sidebar{width:var(--nav-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow:hidden}
.sb-header{padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.sb-logo-img{flex-shrink:0;border-radius:6px}
.sb-title{font-size:0.82rem;font-weight:700;line-height:1.2}
.sb-sub{font-size:0.65rem;color:var(--text2)}
.sb-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
.sb-sec{padding:8px 0}
.sb-sec-hd{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 4px}
.sb-sec-lbl{font-size:0.62rem;text-transform:uppercase;letter-spacing:.6px;color:var(--text2);font-weight:600}
.sb-sec-btn{font-size:0.7rem;background:none;border:none;color:var(--pri);cursor:pointer;padding:2px 6px;border-radius:4px}
.sb-sec-btn:hover{background:var(--pri-hover)}

/* Student card */
.sb-card{margin:4px 10px;padding:10px 12px;background:var(--input-bg);border-radius:var(--radius);border:1px solid var(--border);cursor:pointer;transition:all .15s}
.sb-card:hover{border-color:var(--pri-active-border);background:var(--pri-hover)}
.sb-card-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.sb-card-av{width:30px;height:30px;border-radius:50%;background:var(--pri-light);display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.sb-card-name{font-size:.82rem;font-weight:600}
.sb-card-meta{font-size:.65rem;color:var(--text2);line-height:1.4}
.sb-card-prog{display:flex;align-items:center;gap:6px;margin-top:4px}
.sb-prog-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.sb-prog-fill{height:100%;background:var(--pri);border-radius:2px}
.sb-prog-lbl{font-size:.6rem;color:var(--text2);white-space:nowrap}
.sb-empty{padding:8px 14px;font-size:.72rem;color:var(--text2);text-align:center}
.sb-search{width:calc(100% - 24px);margin:4px 12px 6px;padding:6px 10px;font-size:.72rem;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);outline:none;font-family:inherit;box-sizing:border-box}
.sb-search:focus{border-color:var(--pri)}

/* Agent items */
.sb-agent{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;border:none;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:.8rem;color:var(--text);transition:all .15s;font-family:inherit;text-align:left}
.sb-agent:hover{background:var(--pri-hover);color:var(--pri-dark)}
.sb-agent.active{background:var(--pri-active-bg);border-left-color:var(--pri);color:var(--pri-active-text);font-weight:600}
.sb-agent-ic{font-size:1.1rem;width:24px;text-align:center;flex-shrink:0}
.sb-agent-lb{flex:1;line-height:1.3}
.sb-agent-bg{font-size:.6rem;padding:2px 6px;border-radius:8px;background:var(--pri-light);color:var(--pri-dark);white-space:nowrap}

/* Conv items */
.sb-conv{display:flex;align-items:center;gap:8px;padding:6px 16px 6px 20px;cursor:pointer;font-size:.76rem;color:var(--text);transition:all .12s;border:none;background:none;width:100%;text-align:left;line-height:1.3;font-family:inherit}
.sb-conv:hover{background:var(--pri-hover)}
.sb-conv.active{background:var(--pri-active-bg);color:var(--pri-active-text)}
.sb-conv-ic{font-size:.7rem;flex-shrink:0;opacity:.6}
.sb-conv-tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-conv-tm{font-size:.6rem;color:var(--text2);flex-shrink:0}
.sb-conv-act{display:none;gap:2px}
.sb-conv:hover .sb-conv-act{display:flex}
.sb-conv-act-btn{font-size:.65rem;background:none;border:none;cursor:pointer;padding:1px 4px;border-radius:3px;color:var(--text2)}
.sb-conv-act-btn:hover{background:var(--border)}

/* Settings */
.sb-set{display:flex;align-items:center;gap:8px;width:100%;padding:7px 16px;border:none;background:transparent;cursor:pointer;font-size:.72rem;color:var(--text2);transition:all .12s;font-family:inherit;text-align:left}
.sb-set:hover{background:var(--pri-hover);color:var(--text)}
.sb-set-ic{font-size:.85rem;width:20px;text-align:center;flex-shrink:0}

/* Resizer */
.sb-resizer{width:4px;cursor:col-resize;background:transparent;flex-shrink:0;position:relative;z-index:10;transition:background .15s}
.sb-resizer:hover,.sb-resizer.dragging{background:var(--pri)}
.sb-resizer::after{content:'';position:absolute;top:0;bottom:0;left:-3px;right:-3px}

/* Main AI panel */
.main-panel{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);height:100vh}
.mp-header{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap}
.mp-agent-badge{font-size:.85rem;font-weight:600;padding:4px 12px;border-radius:20px;background:var(--pri-active-bg);color:var(--pri-active-text);white-space:nowrap}
.mp-info{font-size:.75rem;color:var(--text2);white-space:nowrap}
.mp-actions{margin-left:auto;display:flex;gap:6px}
.mp-btn{padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface);cursor:pointer;font-size:.78rem;font-family:inherit;transition:all .15s;white-space:nowrap;color:var(--text)}
.mp-btn:hover{background:#EDF5EE;border-color:var(--success);color:var(--success)}

/* Config */
.mp-config{background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;overflow:hidden;transition:max-height .3s}
.mp-config-inner{padding:12px 16px}
.cfg-title{font-size:.94rem;font-weight:700;margin-bottom:8px}
.cfg-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cfg-sel{padding:7px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.85rem;background:var(--surface);font-family:inherit;cursor:pointer;color:var(--text)}
.cfg-btn{padding:8px 18px;border:none;border-radius:var(--radius-sm);background:var(--pri);color:#fff;font-size:.85rem;cursor:pointer;font-family:inherit;transition:all .15s}
.cfg-btn:hover{filter:brightness(1.08)}
.gram-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:5px}
.gram-cat{font-size:.72rem;font-weight:700;color:var(--text2);grid-column:1/-1;margin-top:6px}
.gram-item{padding:7px 4px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:.8rem;text-align:center;cursor:pointer;transition:all .15s;background:var(--surface);user-select:none}
.gram-item:hover{background:var(--pri-hover);border-color:var(--pri-active-border)}
.gram-item.sel{background:var(--pri-active-bg);color:var(--pri-active-text);border-color:var(--pri-active-border)}

/* Messages */
.mp-messages{flex:1 1 0;overflow-y:auto;overflow-x:hidden;padding:16px 24px;display:flex;flex-direction:column;gap:12px;min-height:0}
.mp-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text2);padding:30px}
.mp-empty-ic{font-size:2.5rem;margin-bottom:10px}
.mp-empty h3{font-size:1.1rem;color:var(--text);margin-bottom:6px}
.mp-empty p{font-size:.88rem}

/* Msg bubbles */
.msg{display:flex;gap:8px;max-width:90%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.asst{align-self:flex-start}
.msg-av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.msg.user .msg-av{background:var(--pri-light)}
.msg.asst .msg-av{background:var(--accent-light)}
.msg-content{background:var(--surface);padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow);line-height:1.7;font-size:.88rem;word-break:break-word;border:1px solid var(--border)}
.msg.user .msg-content{background:var(--pri-dark);color:#fff;border-color:var(--pri-dark)}
.msg-content h2{font-size:1rem;margin:6px 0 3px}
.msg-content h3{font-size:.9rem;margin:5px 0 3px}
.msg-content p{margin-bottom:4px}.msg-content p:last-child{margin-bottom:0}
.msg-content ul,.msg-content ol{padding-left:18px;margin:3px 0}
.msg-content table,.md-table{border-collapse:collapse;width:100%;margin:10px 0;font-size:.82rem;display:table;overflow-x:auto}
.msg-content th,.md-table th{background:var(--pri-light);color:var(--pri-dark);font-weight:700;padding:8px 10px;text-align:left;border:1px solid var(--pri-active-border);white-space:nowrap}
.msg-content td,.md-table td{padding:7px 10px;text-align:left;border:1px solid var(--border);vertical-align:middle;word-break:keep-all;overflow-wrap:break-word}
.msg-content tbody tr:nth-child(even),.md-table tbody tr:nth-child(even){background:var(--input-bg)}
.msg-content tbody tr:hover,.md-table tbody tr:hover{background:var(--pri-hover)}
.msg-content code{background:var(--input-bg);padding:1px 4px;border-radius:3px;font-size:.8rem}
.msg-content pre{background:var(--pri-hover);padding:10px;border-radius:var(--radius-sm);overflow-x:auto;margin:4px 0;font-size:.8rem;line-height:1.4}
.msg-content strong{color:var(--pri-dark)}
.msg.user .msg-content strong{color:#F5EDE9}
.msg-content blockquote{border-left:2px solid var(--pri);padding-left:8px;margin:4px 0;color:var(--text2)}

/* Input */
.mp-input-wrap{display:flex;gap:10px;padding:10px 16px;border-top:1px solid var(--border);align-items:flex-end;flex-shrink:0;background:var(--surface)}
.mp-input-wrap textarea{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:18px;font-size:.88rem;resize:none;outline:none;font-family:inherit;background:var(--input-bg);max-height:100px;color:var(--text)}
.mp-input-wrap textarea:focus{border-color:var(--pri)}
.mp-send{width:38px;height:38px;border-radius:50%;border:none;background:var(--pri);color:#fff;font-size:1.2rem;cursor:pointer;flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center}
.mp-send:hover{filter:brightness(1.1)}
.mp-send:disabled{opacity:.4;cursor:not-allowed}

/* Debug bar */
.debug-bar{display:none}
.debug-dot{width:7px;height:7px;border-radius:50%;background:#FFC107;flex-shrink:0}
.debug-dot.ok{background:#4CAF50}.debug-dot.err{background:#F44336}

/* Loading dots */
.load-dots{display:flex;gap:3px;padding:3px 0}
.load-dots span{width:5px;height:5px;border-radius:50%;background:var(--text2);animation:ld-bounce 1.4s infinite ease-in-out both}
.load-dots span:nth-child(1){animation-delay:-.32s}.load-dots span:nth-child(2){animation-delay:-.16s}
@keyframes ld-bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}

@media(max-width:768px){:root{--nav-w:100vw}.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:200;transform:translateX(-100%);transition:transform .25s}.sidebar.open{transform:translateX(0)}.sb-resizer{display:none}}

/* ═══════════════════════════════════════
   MOBILE APP V5 — Morandi Purple Design System
   Mobile-First Architecture with Hash Router
   ═══════════════════════════════════════ */
.mobile-only{display:none}

@media(max-width:767px){
  /* ═══════ DESIGN TOKENS ═══════ */
  :root{--m-pri:#8B7AC8;--m-pri-light:#EDE8F6;--m-pri-dark:#6B5AA8;--m-bg:#F8F7F4;--m-card:#FFFFFF;--m-text:#2F3437;--m-sub:#8E8B90;--m-border:#E8E7E4;--m-radius:16px;--m-radius-sm:12px;--m-shadow:0 1px 3px rgba(0,0,0,.04);--m-nav-h:72px}

  html{font-size:16px;background:var(--m-bg);height:100%}
  body{display:flex;flex-direction:column;min-height:100dvh;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:var(--m-bg);margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

  /* Hide desktop layout */
  .app,.sidebar,.sb-resizer,.debug-bar,.mp-header,.mp-actions{display:none!important}
  .mobile-only{display:flex}

  /* ═══════ MOBILE APP SHELL ═══════ */
  #mobile-app{display:flex;flex-direction:column;min-height:100dvh;padding-bottom:var(--m-nav-h)}

  /* ═══════ BOTTOM NAVIGATION ═══════ */
  .m-bnav{position:fixed;bottom:0;left:0;right:0;height:var(--m-nav-h);background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:0.5px solid var(--m-border);display:flex;z-index:300;padding:0 4px;padding-bottom:max(4px,env(safe-area-inset-bottom))}
  .m-bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-size:0.6rem;color:var(--m-sub);cursor:pointer;font-family:inherit;font-weight:500;transition:color .15s}
  .m-bnav-item.active{color:var(--m-pri);font-weight:700}
  .m-bnav-item-ic{font-size:1.2rem;transition:transform .15s}
  .m-bnav-item.active .m-bnav-item-ic{transform:translateY(-1px)}

  /* ═══════ PAGE CONTAINER ═══════ */
  .m-page{display:none;flex:1;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--m-bg)}
  .m-page.active{display:flex}

  /* ═══════ HOME PAGE ═══════ */
  .m-home-hero{background:linear-gradient(135deg,var(--m-pri) 0%,#9B8FD4 40%,#BFB8E8 100%);padding:28px 20px 32px;color:#fff;position:relative;overflow:hidden;border-radius:0 0 24px 24px}
  .m-home-hero::after{content:'';position:absolute;top:-40px;right:-20px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06)}
  .m-home-greeting{font-size:1.3rem;font-weight:700;margin-bottom:4px;position:relative;z-index:1;letter-spacing:-.3px}
  .m-home-sub{font-size:0.78rem;opacity:.8;position:relative;z-index:1}
  .m-home-section{padding:0 16px 16px}
  .m-home-sectitle{font-size:0.7rem;font-weight:700;color:var(--m-sub);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;padding-top:8px}

  /* Task Grid */
  .m-task-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .m-task-item{background:var(--m-card);border-radius:var(--m-radius);padding:14px 6px;text-align:center;box-shadow:var(--m-shadow);cursor:pointer;transition:transform .15s}
  .m-task-item:active{transform:scale(.96);background:var(--m-pri-light)}
  .m-task-ic{font-size:1.3rem;margin-bottom:2px}
  .m-task-num{font-size:1.2rem;font-weight:800;color:var(--m-pri);margin-bottom:1px}
  .m-task-lb{font-size:.62rem;font-weight:600;color:var(--m-text)}

  /* Student Card */
  .m-student-card{background:var(--m-card);border-radius:var(--m-radius);padding:16px;box-shadow:var(--m-shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s}
  .m-student-card:active{transform:scale(.98);background:var(--m-pri-light)}
  .m-student-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--m-pri),var(--m-pri-dark));display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;color:#fff}
  .m-student-info{flex:1;min-width:0}
  .m-student-name{font-weight:700;font-size:.9rem;color:var(--m-text)}
  .m-student-meta{font-size:.68rem;color:var(--m-sub);margin-top:1px}
  .m-student-prog{display:flex;align-items:center;gap:8px;margin-top:4px}
  .m-student-bar{flex:1;height:5px;background:var(--m-border);border-radius:3px;overflow:hidden;max-width:100px}
  .m-student-fill{height:100%;background:var(--m-pri);border-radius:3px}
  .m-student-pct{font-size:.7rem;color:var(--m-pri);font-weight:700}
  .m-student-btn{padding:6px 14px;border-radius:14px;background:var(--m-pri-light);color:var(--m-pri);font-size:.68rem;font-weight:600;border:none;cursor:pointer;white-space:nowrap;font-family:inherit}

  /* Workbench Grid */
  .m-wb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .m-wb-card{background:var(--m-card);border-radius:var(--m-radius);padding:16px;box-shadow:var(--m-shadow);cursor:pointer;transition:transform .15s}
  .m-wb-card:active{transform:scale(.97);background:var(--m-pri-light)}
  .m-wb-ic{font-size:1.4rem;margin-bottom:6px}
  .m-wb-title{font-size:.82rem;font-weight:700;color:var(--m-text)}
  .m-wb-sub{font-size:.68rem;color:var(--m-sub);margin-top:2px}

  /* Recent Work */
  .m-recent-list{display:flex;flex-direction:column;gap:6px}
  .m-recent-item{background:var(--m-card);border-radius:var(--m-radius-sm);padding:12px 16px;box-shadow:var(--m-shadow);display:flex;align-items:center;gap:10px;cursor:pointer}
  .m-recent-item:active{background:var(--m-pri-light)}
  .m-recent-ic{font-size:1rem;opacity:.5}
  .m-recent-tl{flex:1;font-size:.8rem;font-weight:600;color:var(--m-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-recent-tm{font-size:.65rem;color:var(--m-sub);flex-shrink:0}

  /* CTA Card */
  .m-cta-card{background:linear-gradient(135deg,var(--m-pri),#9B8FD4);border-radius:var(--m-radius);padding:18px 16px;margin:0 16px 16px;color:#fff;cursor:pointer;transition:transform .15s;position:relative;overflow:hidden}
  .m-cta-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:rgba(255,255,255,.08)}
  .m-cta-card:active{transform:scale(.98)}
  .m-cta-title{font-size:.88rem;font-weight:700;position:relative;z-index:1}
  .m-cta-sub{font-size:.72rem;opacity:.85;margin-top:3px;position:relative;z-index:1}

  /* ═══════ WORKSPACE PAGE — Card Layout ═══════ */
  .m-ws-header{padding:16px 16px 8px;font-size:1rem;font-weight:700;color:var(--m-text)}
  .m-ws-student{padding:0 16px 12px;font-size:.76rem;color:var(--m-sub)}
  .m-agent-cards{display:flex;flex-direction:column;gap:10px;padding:0 16px}
  .m-agent-card{background:var(--m-card);border-radius:var(--m-radius);padding:18px 16px;box-shadow:var(--m-shadow);display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .15s;min-height:80px}
  .m-agent-card:active{transform:scale(.98);background:var(--m-pri-light)}
  .m-agent-card-ic{font-size:1.8rem;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--m-pri-light);border-radius:14px;flex-shrink:0}
  .m-agent-card-info{flex:1}
  .m-agent-card-name{font-size:.88rem;font-weight:700;color:var(--m-text)}
  .m-agent-card-desc{font-size:.7rem;color:var(--m-sub);margin-top:2px}
  .m-agent-card-arrow{color:var(--m-sub);font-size:1rem}

  /* ═══════ AGENT PAGE — ChatGPT Style ═══════ */
  .m-agent-header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--m-card);border-bottom:0.5px solid var(--m-border);flex-shrink:0;position:sticky;top:0;z-index:10}
  .m-agent-back{font-size:1.2rem;background:none;border:none;cursor:pointer;color:var(--m-text);padding:4px 8px 4px 0;font-family:inherit}
  .m-agent-title{font-size:.9rem;font-weight:700;color:var(--m-text)}
  .m-agent-topic{font-size:.7rem;color:var(--m-sub);margin-left:auto;padding:4px 10px;background:var(--m-pri-light);border-radius:10px;color:var(--m-pri-dark);max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .m-agent-config{background:var(--m-bg);padding:4px 16px 8px;border-bottom:0.5px solid var(--m-border);flex-shrink:0;max-height:40vh;overflow-y:auto}

<script>
// ═══════════════════════════════════════
// AUTH CHECK
// ═══════════════════════════════════════
(function(){
  var token=localStorage.getItem('tutor_token');
  if(!token){window.location.href='/login.html';return}
  fetch('/api/auth/me',{headers:{'Authorization':'Bearer '+token}})
    .then(function(r){if(!r.ok)throw new Error('auth');return r.json()})
    .then(function(d){if(!d.user)throw new Error('auth');window._tutorUser=d.user})
    .catch(function(){localStorage.removeItem('tutor_token');window.location.href='/login.html'});
})();

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const AGENT_NAMES={grammar:'📐 语法中心',exam:'📋 智能组卷',writing:'✍️ 作文中心',vocabulary:'📚 智能词汇检测'};
const AGENT_PREFIX={grammar:'gram',exam:'exam',writing:'write',vocabulary:'vocab'};
const GRAMMAR_DATA={
  '词法':['名词','冠词','代词','数词','介词','连词','形容词','副词','动词','情态动词'],
  '时态':['一般现在时','一般过去时','一般将来时','现在进行时','过去进行时','现在完成时','过去完成时'],
  '语态':['被动语态','虚拟语气'],
  '非谓语':['动名词','不定式','分词'],
  '从句':['宾语从句','状语从句','定语从句','主语从句','表语从句','同位语从句'],
  '句式':['五种基本句型','There be','强调句','倒装句','省略','反意疑问句']
};
const TEXTBOOK_DATA={
  '小学':{publishers:['人教PEP','北京版','外研版','北师大版'],grades:['三年级','四年级','五年级','六年级'],semesters:['上册','下册']},
  '初中':{publishers:['人教版','北京版','外研版','北师大版'],grades:['初一','初二','初三'],semesters:['上册','下册']},
  '高中':{publishers:['人教2019版','北京版','外研版'],grades:['高一','高二','高三'],semesters:['必修一','必修二','必修三','选择性必修一','选择性必修二']}
};

function makeSession(agent){
  const pfx=(AGENT_PREFIX[agent]||'conv')+'_';
  const id=pfx+Date.now();
  return {conversations:[{id:id,agent:agent,title:'新会话',messages:[],createdAt:Date.now()}],activeConvId:id,selected:[],examType:'',score:'100',duration:'60',uploadedFile:null,ocrText:'',writeType:'',writeAction:''};
}

const state={
  agent:'grammar',difficulty:'',
  sessions:{
    grammar:makeSession('grammar'),
    exam:makeSession('exam'),
    writing:makeSession('writing'),
    vocabulary:makeSession('vocabulary'),
  },
  teaching:{stage:'',publisher:'',grade:'',semester:'',unit:''},
  vocab:{tab:'gen',step:1,bankId:'',count:20,level:'基础',stage:'',parsed:null},
  isLoading:false
};

let streamEl=null;

// ═══════════════════════════════════════
// MARKDOWN
// ═══════════════════════════════════════
function md(text){
  if(!text)return'';
  var h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  h=h.replace(/^###\s(.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^##\s(.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^#\s(.+)$/gm,'<h1>$1</h1>');
  h=h.replace(/^&gt;\s?(.*)$/gm,'<blockquote>$1</blockquote>');
  h=h.replace(/((?:^\|.+\|\n?)+)/gm,function(m){
    var lines=m.trim().split('\n');
    if(lines.length<2)return m;
    var html='<table class="md-table">';
    lines.forEach(function(line,i){
      var cells=line.split('|').filter(function(_,j,arr){return j>0&&j<arr.length-1}).map(function(c){return c.trim()});
      if(i===0)html+='<thead><tr>'+cells.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr></thead>';
      else if(i===1&&cells.every(function(c){return /^[-: ]+$/.test(c)}))html+='<tbody>';
      else html+='<tr>'+cells.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>';
    });
    html+='</tbody></table>';
    return html;
  });
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/((?:<li>.*<\/li>\s*)+)/g,'<ul>$1</ul>');
  h=h.replace(/<\/ul>\s*<ul>/g,'');
  h=h.replace(/\n\n/g,'</p><p>');
  h=h.replace(/\n/g,'<br>');
  h='<p>'+h+'</p>';
  h=h.replace(/<p>\s*<\/p>/g,'');
  h=h.replace(/<p><table/g,'<table');
  h=h.replace(/<\/table><\/p>/g,'</table>');
  return h;
}

// ═══════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════
function dbg(m,s){
  const el=document.getElementById('dbgMsg'),dot=document.getElementById('dbgDot');
  if(el)el.textContent=m;
  if(dot){dot.className='debug-dot';if(s==='ok')dot.className='debug-dot ok';if(s==='err')dot.className='debug-dot err'}
}

function cur(){return state.sessions[state.agent]}
function curConv(){
  const s=cur();
  // Filter out any conversations that don't belong to this agent (data integrity safety net)
  if(s.conversations&&s.conversations.length>0){
    s.conversations=s.conversations.filter(function(c){return !c.agent||c.agent===state.agent});
  }
  if(!s.conversations||!s.conversations.length){const pfx=(AGENT_PREFIX[state.agent]||'conv')+'_';s.conversations=[{id:pfx+Date.now(),agent:state.agent,title:'新会话',messages:[],createdAt:Date.now()}];s.activeConvId=s.conversations[0].id}
  let c=s.conversations.find(function(x){return x.id===s.activeConvId});
  if(!c){c=s.conversations[0];s.activeConvId=c.id}
  return c;
}

      if(d.sessions){

            if(saved.conversations&&saved.conversations.length>0){
              // Data migration: tag old conversations with their agent bucket + filter cross-contamination
              state.sessions[k].conversations=saved.conversations.filter(function(c){return !c.agent||c.agent===k}).map(function(c){c.agent=c.agent||k;return c});
            }
            if(saved.selected)state.sessions[k].selected=saved.selected;
            ['examType','score','duration','writeType','writeAction','ocrText'].forEach(function(f){if(saved[f]!==undefined)state.sessions[k][f]=saved[f]});
          }
        });

    if(!s.conversations)s.conversations=[];
    if(!Array.isArray(s.selected))s.selected=[];
  });
}

// WORD EXPORT
// ═══════════════════════════════════════
const AI_CHATTER=[/^好的[，,。！!][\s\S]{0,60}$/gm,/^收到[，,。！!][\s\S]{0,60}$/gm,/^下面[我我们]?[开始将给来][\s\S]{0,80}$/gm,/^首先[，,]?[\s\S]{0,80}$/gm,/^现在[，,]?[\s\S]{0,80}$/gm,/^我[将会建议][\s\S]{0,80}$/gm];

function cleanWord(text){
  let t=text;
  AI_CHATTER.forEach(p=>{t=t.replace(p,'')});
  t=t.replace(/```[\s\S]*?```/g,m=>m.replace(/```\w*\n?/g,'').replace(/```/g,''));
  t=t.replace(/`([^`]+)`/g,'$1').replace(/\*\*([^*]+)\*\*/g,'$1').replace(/\*([^*]+)\*/g,'$1');
  t=t.replace(/^#{1,6}\s/gm,'').replace(/^&gt;\s?/gm,'').replace(/^>\s?/gm,'');
  t=t.replace(/^[-*_=]{3,}\s*$/gm,'').replace(/[ ]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  return t;
}

function buildDocTitle(section){
  const diff=state.difficulty||'';const agent=state.agent;let prefix='';
  if(agent==='grammar'){const sel=state.sessions.grammar.selected||[];prefix=diff+'语法-'+((sel.length>0)?sel.join('、'):'综合')}
  else if(agent==='teaching'){const t=state.teaching;prefix=[diff,t.grade,t.publisher,t.semester,t.unit?'Unit'+t.unit:''].filter(Boolean).join('·')}
  else if(agent==='exam'){prefix=diff+(state.sessions.exam.examType||'英语试卷')}
  else if(agent==='writing'){prefix=diff+(state.sessions.writing.writeType||'英语作文')}
  else if(agent==='vocabulary'){prefix=(state.vocab.stage||diff||'英语')+'词汇检测'+(state.vocab.count||20)+'题'}
  else{prefix=diff||'英语'}
  const labels={exam:'试卷版',answer:'答案版',teacher:'教师版（含解析）'};
  return prefix+' — '+labels[section];
}

function buildWordHTML(section){
  const now=new Date().toLocaleString('zh-CN');const title=buildDocTitle(section);
  let rawContent='';
  curMsgs().forEach(msg=>{
    if(msg.role!=='assistant')return;let text=msg.content;
    if(section==='exam'){const m=text.match(/【试卷版】([\s\S]*?)(?=【答案版】|【教师版】|$)/);rawContent+=(m?m[1]:text)+'\n'}
    else if(section==='answer'){const m=text.match(/【答案版】([\s\S]*?)(?=【教师版】|$)/);rawContent+=(m?m[1]:'')+'\n'}
    else if(section==='teacher'){const m=text.match(/【教师版】([\s\S]*)/);rawContent+=(m?m[1]:text)+'\n'}
  });
  // 词汇模块：剥离【教师版】尾部的 json 机器数据块与「## 机器数据」标题；目标段为空时回退全文，保证 Word 永不空白
  if(state.agent==='vocabulary'){
    rawContent=rawContent.replace(/```json[\s\S]*?```/g,'').replace(/^##\s*机器数据[^\n]*$/gm,'');
    if(!rawContent.trim()){
      var _full='';curMsgs().forEach(function(m){if(m.role==='assistant')_full+=(m.content||'')+'\n';});
      rawContent=_full.replace(/```json[\s\S]*?```/g,'').replace(/^##\s*机器数据[^\n]*$/gm,'').replace(/【试卷版】|【答案版】|【教师版】/g,'\n');
    }
  }
  // Render markdown tables to HTML, then convert to Word-native tables
  let rendered=md(rawContent);
  // Convert <table> to Word-compatible format with borders
  rendered=rendered
    .replace(/<table class="md-table">/g,'<table border="1" cellpadding="6" cellspacing="0" style="border-collapse:collapse;width:100%;margin:10px 0">')
    .replace(/<th>/g,'<th style="background:#E9E4F7;color:#5F4B8B;font-weight:bold;font-family:SimHei,sans-serif;padding:6px 10px;text-align:left">')
    .replace(/<td>/g,'<td style="padding:5px 10px;text-align:left;vertical-align:middle;word-break:keep-all">');
  // Clean remaining markdown from non-table content
  rendered=cleanWord(rendered);
  if(!rendered.trim()||rendered==='<p></p>')rendered='（暂无内容，请先生成）';
  return'<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>'+title+'</title><style>@page{size:A4;margin:2.5cm}body{font-family:"Microsoft YaHei","Times New Roman",serif;font-size:14px;line-height:1.5;color:#000}h1{text-align:center;font-size:20px;font-family:"Microsoft YaHei",sans-serif}h2{font-size:16px;font-family:"Microsoft YaHei",sans-serif}.info{text-align:center;font-size:12px;border-bottom:1.5px solid #000;padding-bottom:10px;margin-bottom:16px}.content{white-space:pre-wrap}.footer{text-align:center;margin-top:24px;font-size:10px;color:#888;border-top:1px solid #ccc;padding-top:8px}table{page-break-inside:avoid}thead{display:table-header-group}</style></head><body><h1>'+title+'</h1><div class="info">Melix Teacher | 导出时间：'+now+' | 难度：'+(state.difficulty||'默认')+'</div><div class="content">'+rendered+'</div><div class="footer">—— Melix Teacher · 专业教学资料 ——</div></body></html>';
}

function exportDoc(section){
  if(!curMsgs().length){alert('请先生成内容再导出');return}
  const title=buildDocTitle(section);const html=buildWordHTML(section);
  const blob=new Blob(['﻿'+html],{type:'application/msword;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
  a.download=title+'_'+new Date().toISOString().slice(0,10)+'.doc';
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
}

function convTitle(msgs){
  if(!msgs||!msgs.length)return'新会话';
  for(let i=0;i<msgs.length;i++){if(msgs[i].role==='user'){
    let t=msgs[i].content.replace(/【[^】]*】/g,'').trim();
    t=t.replace(/^你是[^。]{2,30}。/,'').replace(/^请/,'').trim();
    t=t.split(/[\n。]/)[0].trim();
    if(t.length>25)t=t.slice(0,25)+'…';
    return t||'新会话';
  }}
  return'新会话';
}
function newConv(){
  const s=cur();const c=curConv();
  if(c&&c.messages.length>0)c.title=convTitle(c.messages);
  const pfx=(AGENT_PREFIX[state.agent]||'conv')+'_';
  const id=pfx+Date.now();
  s.conversations.push({id:id,agent:state.agent,title:'新会话',messages:[],createdAt:Date.now()});
  s.activeConvId=id;
  if(state.agent==='grammar')s.selected=[];
  if(state.agent==='grade'){s.uploadedFile=null;s.ocrText='';}
  if(state.agent==='writing'){s.writeType='';s.writeAction='';}
  if(state.agent==='exam'){s.examType='';s.score='100';s.duration='60';}
  renderMsgs();renderConvList();updateEmpty();saveAll();
}
function switchConv(convId){
  const s=cur();const c=curConv();
  if(c&&c.messages.length>0)c.title=convTitle(c.messages);
  s.activeConvId=convId;
  renderMsgs();renderConvList();updateEmpty();saveAll();
}
function deleteConv(convId){
  const s=cur();
  if(!s.conversations||s.conversations.length<=1)return;
  const idx=s.conversations.findIndex(x=>x.id===convId);
  if(idx<0)return;
  s.conversations.splice(idx,1);
  if(s.activeConvId===convId)s.activeConvId=s.conversations[0].id;
  renderMsgs();renderConvList();updateEmpty();saveAll();
}
function renderConvList(){
  const el=document.getElementById('sbConvList');if(!el)return;
  const s=cur();
  // Double-filter: only show conversations that belong to current agent
  if(s.conversations&&s.conversations.length>0){
    s.conversations=s.conversations.filter(function(c){return !c.agent||c.agent===state.agent});
  }
  if(!s.conversations||!s.conversations.length){el.innerHTML='<div class="sb-empty">暂无会话记录</div>';return}
  // Search filter
  const q=(document.getElementById('sbConvSearch')||{}).value||'';
  const kw=q.trim().toLowerCase();
  let convs=s.conversations.filter(function(c){return c.agent===state.agent}).reverse();
  if(kw)convs=convs.filter(function(c){return(c.title||'').toLowerCase().includes(kw)});
  // Favorites first
  convs.sort(function(a,b){return(b.fav?1:0)-(a.fav?1:0)});
  if(!convs.length){el.innerHTML='<div class="sb-empty">无匹配会话</div>';return}
  const now=Date.now(),aid=s.activeConvId;
  el.innerHTML=convs.map(c=>{
    const isActive=c.id===aid;
    let ts='';const diff=now-c.createdAt;
    if(diff<86400000)ts='今天';else if(diff<172800000)ts='昨天';else if(diff<604800000)ts='本周';else ts=new Date(c.createdAt).toLocaleDateString('zh-CN',{month:'short',day:'numeric'});
    const title=c.title||convTitle(c.messages);
    return'<div class="sb-conv'+(isActive?' active':'')+'" onclick="switchConv(\''+c.id+'\')">'+
      '<span class="sb-conv-ic">'+(c.fav?'⭐':isActive?'💬':'📄')+'</span>'+
      '<span class="sb-conv-tl">'+title+'</span>'+
      '<span class="sb-conv-tm">'+ts+'</span>'+
      '<span class="sb-conv-act">'+
        '<button class="sb-conv-act-btn" title="收藏" onclick="event.stopPropagation();toggleFav(\''+c.id+'\')">'+(c.fav?'★':'☆')+'</button>'+
        '<button class="sb-conv-act-btn" title="重命名" onclick="event.stopPropagation();renameConv(\''+c.id+'\')">✏</button>'+
        '<button class="sb-conv-act-btn" title="删除" onclick="event.stopPropagation();deleteConv(\''+c.id+'\')">✕</button>'+
      '</span></div>';
  }).join('');
}
function toggleFav(id){
  const s=cur();const c=(s.conversations||[]).find(x=>x.id===id);
  if(c){c.fav=!c.fav;saveAll();renderConvList()}
}
function renameConv(id){
  const s=cur();const c=(s.conversations||[]).find(x=>x.id===id);

  const name=prompt('重命名会话：',c.title||'');
  if(name!==null&&name.trim()){c.title=name.trim();saveAll();renderConvList()}
}

function addMsg(role,content,streaming){

function finishStreaming(){

function normalizeWord(raw){
  if(!raw)return null;
  var word=(raw.word||'').toString().trim().replace(/^\s*\d+\s*[.、)）]\s*/,'').replace(/[*✱★]/g,'').trim();
  word=word.replace(/\s+\(?(n\.?|v\.?|vt\.?|vi\.?|adj\.?|adv\.?|prep\.?|conj\.?|pron\.?|num\.?|art\.?|int\.?|det\.?|phr\.?|abbr\.?|modal\.?)\)?\s*$/i,'').trim();
  if(!/^[a-zA-Z][a-zA-Z'’ \-]{0,40}$/.test(word))return null;
  var meaning=(raw.meaning||'').toString().trim().replace(/[*✱★]/g,'').replace(/^[\s;；,，、]+/,'').trim();
  return {
    id:'v_'+Date.now()+'_'+Math.floor(Math.random()*1e6),
    word:word,meaning:meaning,pos:(raw.pos||'').toString().trim(),
    phonetic:(raw.phonetic||'').toString().trim(),example:(raw.example||'').toString().trim(),
    stage:raw.stage||'',grade:raw.grade||'',unit:(raw.unit||'').toString().trim(),
    source:raw.source||'',sourceType:raw.sourceType||'upload',
    mastery:0,wrongCount:0,wrongReason:'',difficulty:1,lastReview:0,
    nextReview:0,ease:2.5,interval:0,createdAt:Date.now()
  };
}
function parseFreeCell(text){
  var t=(text||'').toString().trim().replace(/^\s*\d+\s*[.、)）:：]\s*/,'');
  var out={word:'',phonetic:'',pos:'',meaning:''};
  var ph=t.match(/(\/[^\/]+\/|\[[^\]]+\])/);if(ph){out.phonetic=ph[1];t=t.replace(ph[1],' ');}
  var wm=t.match(/^\s*([a-zA-Z][a-zA-Z'’ \-]{0,40})/);
  if(wm){
    var wraw=wm[1].trim();
    // 词性可能被吞入单词尾部（如 "abandon v"），剥离之
    var pm2=wraw.match(/^(.+?)\s+\(?(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|det|phr|abbr|modal)\.?$/i);
    if(pm2){out.word=pm2[1].trim();out.pos=pm2[2];}else{out.word=wraw;}
    t=t.slice(wm[0].length);
  }
  var pm=t.match(/^\s*[\(（]?\s*(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|det|phr|abbr|modal)\.?\s*[\)）]?/i);
  if(pm){out.pos=out.pos||pm[1];t=t.slice(pm[0].length);}
  var rest=t.replace(/^[\s,，;；:：、.。]+/,'').trim();
  if(/[一-龥]/.test(rest))out.meaning=rest;
  return out;
}
function classifyColumn(values){
  var sample=values.filter(function(v){return String(v).trim()!==''}).slice(0,30);
  if(!sample.length)return 'junk';
  var scores={word:0,meaning:0,pos:0,phonetic:0,example:0,unit:0};
  sample.forEach(function(v){
    v=String(v).trim();
    if(/^[a-zA-Z][a-zA-Z'’ \-]{0,40}$/.test(v))scores.word++;
    if(/[一-龥]/.test(v))scores.meaning++;
    if(/^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|det|phr|abbr|modal)(\.|、)?$/i.test(v)||/^(名词|动词|形容词|副词|介词|连词|代词|冠词|数词|感叹词|短语)$/.test(v))scores.pos++;
    if(/[\/\[].{2,}[\/\]]/.test(v)||/[əæɑɔɪʊʌɛðθŋˈː]/.test(v))scores.phonetic++;
    if(/^[a-zA-Z].*\s.*\s/.test(v)&&v.length>25)scores.example++;
    if(/u(nit)?\s*\d+|第?\s*\d+\s*单元|^L\d+|lesson\s*\d+/i.test(v))scores.unit++;
  });
  var best='junk',max=0;Object.keys(scores).forEach(function(k){if(scores[k]>max){max=scores[k];best=k}});

  return best;
}
function gridToVocab(rows,meta){
  var report={totalRows:0,recognized:0,missingMeaning:0,duplicate:0,skippedSamples:[]};
  if(!rows||!rows.length)return {items:[],report:report};
  var HEADER_KEYS={word:/单词|word|英文|词汇|english|词/i,meaning:/释义|中文|意思|meaning|chinese|translation|解释/i,pos:/词性|pos|part\s*of\s*speech|词类/i,phonetic:/音标|phonetic|pronunciation|发音/i,example:/例句|example|sentence|造句/i,unit:/unit|单元|课|lesson/i};
  var headerIdx=-1,colMap={};

    var score=0,cm={};
    rows[r].forEach(function(cell,ci){var c=String(cell).trim();if(!c)return;
      Object.keys(HEADER_KEYS).forEach(function(k){if(HEADER_KEYS[k].test(c)&&cm[k]===undefined){cm[k]=ci;score++;}});});
    if(score>=2){headerIdx=r;colMap=cm;break;}
  }
  var dataRows;
  if(headerIdx>=0){dataRows=rows.slice(headerIdx+1);}
  else{
    var maxCols=0;rows.forEach(function(rw){if(rw.length>maxCols)maxCols=rw.length;});
    for(var c=0;c<maxCols;c++){var vals=rows.map(function(rw){return rw[c]||''});var kind=classifyColumn(vals);if(kind!=='junk'&&colMap[kind]===undefined)colMap[kind]=c;}
    dataRows=rows;
  }

  var items=[],seen={},hasStructure=(colMap.word!==undefined&&colMap.meaning!==undefined);
  dataRows.forEach(function(rw){
    var raw={};
    if(hasStructure){
      raw.word=rw[colMap.word];raw.meaning=rw[colMap.meaning];
      if(colMap.pos!==undefined)raw.pos=rw[colMap.pos];
      if(colMap.phonetic!==undefined)raw.phonetic=rw[colMap.phonetic];
      if(colMap.example!==undefined)raw.example=rw[colMap.example];
      if(colMap.unit!==undefined)raw.unit=rw[colMap.unit];
    }else{
      var cell='';for(var i=0;i<rw.length;i++){if(String(rw[i]).trim()&&/[a-zA-Z]/.test(rw[i])){cell=rw[i];break;}}
      if(!cell&&rw.length)cell=rw[0];
      raw=parseFreeCell(cell);
    }
    raw.stage=meta.stage;raw.grade=meta.grade;raw.source=meta.source;raw.sourceType='upload';
    if(!raw.unit)raw.unit=meta.unit;
    var item=normalizeWord(raw);
    if(!item){var joined=rw.map(function(c){return String(c).trim()}).filter(Boolean).join(' ');if(joined&&report.skippedSamples.length<5)report.skippedSamples.push(joined.slice(0,40));return;}
    if(!item.meaning)report.missingMeaning++;
    var key=item.word.toLowerCase();if(seen[key]){report.duplicate++;return;}
    seen[key]=true;items.push(item);report.recognized++;
  });

}
function parseFreeText(text,meta){
  var items=[],seen={},report={totalRows:0,recognized:0,missingMeaning:0,duplicate:0,skippedSamples:[]};
  var lines=(text||'').toString().split(/\r?\n/);report.totalRows=lines.length;
  lines.forEach(function(line){
    line=line.trim();if(!line)return;
    var raw=parseFreeCell(line);raw.stage=meta.stage;raw.grade=meta.grade;raw.source=meta.source;raw.unit=meta.unit;raw.sourceType='upload';
    var item=normalizeWord(raw);
    if(!item||!item.meaning){if(report.skippedSamples.length<5)report.skippedSamples.push(line.slice(0,40));return;}
    var key=item.word.toLowerCase();if(seen[key]){report.duplicate++;return;}
    seen[key]=true;items.push(item);report.recognized++;
  });
  return {items:items,report:report};
}
function inferMeta(fileName,items){
  var fn=fileName||'';var s=fn+' '+items.slice(0,20).map(function(i){return i.unit||''}).join(' ');
  var meta={stage:'',grade:'',source:'',unit:''};
  if(/人教|PEP/i.test(s))meta.source='人教PEP';else if(/北京版/i.test(s))meta.source='北京版';
  else if(/外研/i.test(s))meta.source='外研版';else if(/北师大/i.test(s))meta.source='北师大版';
  if(/小学|[三四五六]年级/i.test(fn))meta.stage='小学';
  else if(/初中|初一|初二|初三|[七八九]年级/i.test(fn))meta.stage='初中';
  else if(/高中|高一|高二|高三|必修|选择性/i.test(fn))meta.stage='高中';
  var gm=fn.match(/([三四五六七八九])年级/);if(gm)meta.grade=gm[1]+'年级';
  var units={};items.forEach(function(i){if(i.unit)units[i.unit]=1;});
  var ul=Object.keys(units);
  if(ul.length===1)meta.unit=ul[0];
  else if(ul.length>1){var nums=ul.map(function(u){var m=u.match(/\d+/);return m?+m[0]:null}).filter(function(x){return x!=null}).sort(function(a,b){return a-b});if(nums.length)meta.unit='U'+nums[0]+'-U'+nums[nums.length-1];}
  return meta;
}
async function parsePdf(file){
  var loaded=await ensureVendor('pdf');
  var lib=window.pdfjsLib||window['pdfjs-dist/build/pdf'];
  if(!loaded||!lib)return {ok:false,error:'PDF 解析组件加载失败，请检查网络后重试'};
  try{
    // worker 用 Blob URL 实例化，规避路径/同源/MIME 问题（最可靠）
    if(!lib.GlobalWorkerOptions.workerSrc){
      try{
        var wt=await (await fetch('/lib/vendor/pdf.worker.min.js')).text();
        lib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([wt],{type:'application/javascript'}));
      }catch(e){lib.GlobalWorkerOptions.workerSrc='/lib/vendor/pdf.worker.min.js';}
    }
    var buf=await file.arrayBuffer();
    var pdf=await lib.getDocument({data:buf,cMapUrl:'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',cMapPacked:true,useSystemFonts:true}).promise;
    var lines=[];
    var maxPages=Math.min(pdf.numPages,50);
    for(var p=1;p<=maxPages;p++){
      var page=await pdf.getPage(p);
      var tc=await page.getTextContent();
      var rows={};
      tc.items.forEach(function(it){
        var y=Math.round(it.transform[5]/3)*3;
        if(!rows[y])rows[y]=[];
        rows[y].push({x:it.transform[4],s:it.str});
      });
      Object.keys(rows).map(Number).sort(function(a,b){return b-a}).forEach(function(y){
        var line=rows[y].sort(function(a,b){return a.x-b.x}).map(function(o){return o.s}).join(' ');
        if(line.trim())lines.push(line);
      });
    }
    var text=lines.join('\n');
    if(!text.trim())return {ok:false,error:'该 PDF 没有可提取的文字层（很可能是扫描件/图片型 PDF），请改用粘贴文本'};
    return {ok:true,text:text};
  }catch(e){
    return {ok:false,error:'PDF 解析出错：'+((e&&e.message)||String(e))};
  }
}
async function parseVocabFile(file){
  var name=file.name||'';var ext=(name.split('.').pop()||'').toLowerCase();
  var meta=inferMeta(name,[]);
  var empty={totalRows:0,recognized:0,missingMeaning:0,duplicate:0,skippedSamples:[]};
  if(/^image\//.test(file.type)||['png','jpg','jpeg','gif','bmp','webp'].indexOf(ext)>=0){
    return {items:[],meta:meta,report:empty,needPaste:true,reason:'图片暂不支持自动解析，请粘贴词表文本'};
  }
  if(ext==='pdf'){
    var pres=await parsePdf(file);
    if(pres.ok&&pres.text&&pres.text.trim()){
      var pr=parseFreeText(pres.text,meta);
      if(pr.items.length)return {items:pr.items,meta:inferMeta(name,pr.items),report:pr.report,needPaste:false};
      return {items:[],meta:meta,report:empty,needPaste:true,reason:'PDF 已提取到文字，但未匹配到词汇格式，请粘贴文本。提取预览：'+pres.text.replace(/\n/g,' / ').slice(0,80)};
    }

  }
  try{
    if(ext==='xlsx'||ext==='xls'||ext==='csv'){
      if(!(await ensureVendor('xlsx')))return {items:[],meta:meta,report:empty,needPaste:true,reason:'Excel 解析组件加载失败，请检查网络或改用粘贴'};
      var buf=await file.arrayBuffer(),wb;
      if(ext==='csv'){var txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){txt=new TextDecoder('gbk').decode(buf);}wb=XLSX.read(txt,{type:'string'});}
      else{wb=XLSX.read(buf,{type:'array'});}
      var all=[],agg={totalRows:0,recognized:0,missingMeaning:0,duplicate:0,skippedSamples:[]};
      wb.SheetNames.forEach(function(sn){

        var sm=Object.assign({},meta);var um=sn.match(/u(nit)?\s*\d+|必修.+/i);if(um&&!sm.unit)sm.unit=um[0];
        var r=gridToVocab(rows,sm);all=all.concat(r.items);
        agg.totalRows+=r.report.totalRows;agg.recognized+=r.report.recognized;agg.missingMeaning+=r.report.missingMeaning;agg.duplicate+=r.report.duplicate;
        agg.skippedSamples=agg.skippedSamples.concat(r.report.skippedSamples).slice(0,5);
      });

    }
    if(ext==='docx'){
      if(!(await ensureVendor('mammoth')))return {items:[],meta:meta,report:empty,needPaste:true,reason:'Word 解析组件加载失败，请检查网络或改用粘贴'};
      var ab=await file.arrayBuffer();
      var html=(await mammoth.convertToHtml({arrayBuffer:ab})).value;
      var doc=new DOMParser().parseFromString(html,'text/html');var table=doc.querySelector('table');
      if(table){
        var rows=[];table.querySelectorAll('tr').forEach(function(tr){var cells=[];tr.querySelectorAll('td,th').forEach(function(td){cells.push(td.textContent.trim())});if(cells.length)rows.push(cells);});

    }

  }catch(e){
    return {items:[],meta:meta,report:empty,needPaste:true,reason:'解析出错：'+(e.message||e)+'，请粘贴文本'};
  }
}

  stats:function(){

    this._data.banks.forEach(function(b){(b.items||[]).forEach(function(it){words++;if(it.wrongCount>0)wrong++;});});
    var bytes=0;try{bytes=(localStorage.getItem('melix_vocab_v1')||'').length;}catch(e){}
    return {bankCount:this._data.banks.length,wordCount:words,wrongCount:wrong,approxBytes:bytes};
  },
  addBank:function(meta,items){
    this.load();var st=this.stats();
    if(items.length>3000){alert('单词库最多 3000 词，当前 '+items.length+' 词，请拆分后上传。');return null;}
    if(this._data.banks.length>=20){alert('词库数量已达上限（20 个），请先删除旧词库。');return null;}
    if(st.wordCount+items.length>6000){alert('总词库容量已达上限（6000 词），请先删除旧词库。');return null;}
    var nm=[meta.source,meta.grade,meta.unit].filter(Boolean).join(' ')||'未命名词库';
    var bank={id:'bank_'+Date.now(),name:nm,stage:meta.stage||'',grade:meta.grade||'',source:meta.source||'',unit:meta.unit||'',sourceType:'upload',createdAt:Date.now(),items:items};
    this._data.banks.push(bank);this.save();return bank;
  },
  deleteBank:function(id){this.load();this._data.banks=this._data.banks.filter(function(b){return b.id!==id});this.save();},
  findItemByWord:function(word){
    this.load();var w=(word||'').toLowerCase().trim();
    for(var i=0;i<this._data.banks.length;i++){var b=this._data.banks[i];for(var j=0;j<(b.items||[]).length;j++){if(b.items[j].word.toLowerCase()===w)return b.items[j];}}
    return null;
  },
  recordWrong:function(word,info){
    this.load();var item=this.findItemByWord(word);
    if(!item){
      var it=normalizeWord({word:word,meaning:info.meaning||'',source:'错词录入',sourceType:'builtin',stage:info.stage||''});
      if(!it){alert('单词格式不正确');return;}
      if(!this._data.banks.length)this._data.banks.push({id:'bank_'+Date.now(),name:'错词本',stage:'',grade:'',source:'',unit:'',sourceType:'builtin',createdAt:Date.now(),items:[]});
      this._data.banks[0].items.push(it);item=it;
    }
    item.wrongCount=(item.wrongCount||0)+(info.count||1);
    if(info.reason)item.wrongReason=info.reason;
    item.lastReview=Date.now();this.save();
  },
  clearWrong:function(word){var it=this.findItemByWord(word);if(it){it.wrongCount=0;it.wrongReason='';this.save();}},
  wrongList:function(){
    this.load();var arr=[];
    this._data.banks.forEach(function(b){(b.items||[]).forEach(function(it){if(it.wrongCount>0)arr.push(it);});});
    arr.sort(function(a,b){return b.wrongCount-a.wrongCount});return arr;
  }
};

function sampleTargets(bank,count){
  var items=(bank&&bank.items)||[];
  var targetCount=Math.min(items.length,Math.round(count*0.65));
  var pool=items.slice().sort(function(a,b){return (b.wrongCount-a.wrongCount)||(a.mastery-b.mastery)||(Math.random()-0.5);});
  var targets=pool.slice(0,targetCount);
  return {targets:targets,extCount:Math.max(0,count-targets.length)};
}
function chunkTargets(targets,batchCount){
  var chunks=[],n=targets.length,base=Math.floor(n/batchCount),rem=n%batchCount,idx=0;
  for(var i=0;i<batchCount;i++){var sz=base+(i<rem?1:0);chunks.push(targets.slice(idx,idx+sz));idx+=sz;}
  return chunks.filter(function(c){return c.length>0});
}
function buildVocabPrompt(p){

  function fmt(it,i){return (i+1)+'. '+it.word+(it.phonetic?' '+it.phonetic:'')+(it.pos?' '+it.pos:'')+' '+(it.meaning||'')+(it.unit?' ['+it.unit+']':'');}
  var L=[];

  }
  L.push('扩展词：本批另出 '+p.batchExtCount+' 题，考查北京K12'+(p.stage||'')+'体系词汇（可参考知识库 vocabulary 中同学段词条），不得与任一目标词重复。');

  L.push('3. 干扰项：3 个干扰项必须与正确答案词性一致、语义相关（近义/反义/形近/同主题易混），长度相近；正确项在 A/B/C/D 中随机分布，整套不得出现位置规律。');
  L.push('4. 语境句用词不超纲（扩展词考查点除外），句长匹配学段。');
  L.push('5. 题号连续：本批从第 '+p.startNo+' 题编到第 '+p.endNo+' 题。');
  L.push('');L.push('■ 输出格式（严格照排，用于 Word 导出与机器解析）');
  L.push('【重要】三个标记【试卷版】【答案版】【教师版】缺一不可，且每个标记下必须有完整对应内容：【试卷版】完整列出本批所有题目的题干与 A-D 选项（此处不得出现答案）；【答案版】仅列答案字母；【教师版】逐题解析。解析务必精炼（每题不超过 30 字），避免冗长导致截断。');

// 词汇批处理专用：发送一条 user 消息并流式收完，返回完整助手文本。isLoading/按钮由调用方管。
async function sendMsgCore(text,internal){
  addMsg('user',text);
  if(internal){const _ms=curMsgs();if(_ms.length)_ms[_ms.length-1].internal=true;}
  const allMsgs=curMsgs();const apiMsgs=[];
  for(let i=Math.max(0,allMsgs.length-11);i<allMsgs.length-1;i++){
    if(!allMsgs[i].streaming)apiMsgs.push({role:allMsgs[i].role,content:allMsgs[i].content});
  }
  apiMsgs.push({role:'user',content:text});
  addMsg('assistant','',true);
  let full='';
  const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,agent:state.agent})});
  if(!resp.ok){const err=await resp.json().catch(()=>({error:'HTTP '+resp.status}));finishStreaming();throw new Error(err.error||'请求失败')}
  const reader=resp.body.getReader();const decoder=new TextDecoder();let buf='';
  while(true){
    const{done,value}=await reader.read();if(done)break;
    buf+=decoder.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
    for(const line of lines){if(line.startsWith('data: ')){try{const d=JSON.parse(line.slice(6));if(d.type==='text'){full+=d.text;addMsg('assistant',full,true)}}catch(e){}}}
  }
  finishStreaming();
  const conv=curConv();if(conv&&conv.messages.length>0)conv.title=convTitle(conv.messages);
  renderConvList();saveAll();
  return full;
}

  var bar=document.getElementById('vocabProgressBar');if(bar)bar.style.width=Math.round(i/n*100)+'%';
  var lbl=document.getElementById('vocabProgressLbl');if(lbl)lbl.textContent='正在生成第 '+i+'/'+n+' 批…';
}
async function applyVocabGenerate(mode){
  if(state.isLoading)return;
  var cEl=document.getElementById('vocabCount');if(cEl)state.vocab.count=+cEl.value;
  var lEl=document.getElementById('vocabLevel');if(lEl)state.vocab.level=lEl.value;
  var sEl=document.getElementById('vocabStage');if(sEl&&sEl.value)state.vocab.stage=sEl.value;
  saveAll();
  var isReview=(mode==='review');
  var bank=VocabStore.getBank(state.vocab.bankId);
  var stage=state.vocab.stage||(bank&&bank.stage)||'';
  var targets,r,count;
  if(isReview){
    targets=VocabStore.wrongList();
    if(!targets.length){alert('错词本为空，请先录入错词');return;}
    count=targets.length;r={targets:targets,extCount:0};
  }else{
    if(!bank){alert('请先上传词表或选择词库');return;}
    count=state.vocab.count||20;r=sampleTargets(bank,count);
    if(!r.targets.length){alert('词库为空');return;}
  }
  var batchTotal=Math.max(1,Math.ceil(count/20));
  var batches=chunkTargets(r.targets,batchTotal);
  var extLeft=r.extCount;
  state.isLoading=true;
  var btn=document.getElementById('vocabGenBtn');
  state._vocabGenerating=true;state._vocabProgress='正在准备…';renderMsgs();
  try{
    var startNo=1;
    for(var i=0;i<batches.length;i++){
      var batchItems=batches[i];
      var batchExt=(i<batches.length-1)?Math.round(extLeft/(batches.length-i)):extLeft;
      extLeft-=batchExt;
      var endNo=startNo+batchItems.length+batchExt-1;
      state._vocabProgress='正在生成第 '+(i+1)+'/'+batches.length+' 批…';
      if(btn)btn.textContent='⏳ 生成中 '+(i+1)+'/'+batches.length+' 批…';
      updateVocabProgress(i+1,batches.length);
      var prompt=buildVocabPrompt({batchNo:i+1,batchTotal:batches.length,batchItems:batchItems,isFirst:i===0,
        fullTargets:r.targets,extCount:r.extCount,batchExtCount:batchExt,count:count,
        level:isReview?'错词强化':(state.vocab.level||'基础'),stage:stage,startNo:startNo,endNo:endNo});
      await sendMsgCore(prompt,true);
      startNo=endNo+1;
    }
    tryImportQuizJSON();
    var _cv=curConv();if(_cv)_cv.title='词汇检测 '+count+'题'+(isReview?'（复习卷）':'');
    state.vocab.step=4;saveAll();renderVocabTab('gen');
  }catch(e){
    alert('生成中断：'+(e.message||e)+'。已生成的批次保留在对话区，可新建会话重试。');
  }finally{
    state._vocabGenerating=false;state._vocabProgress='';
    state.isLoading=false;if(btn)btn.textContent='📚 生成检测试卷';
    renderMsgs();renderConvList();
  }
}
function extractQuizJSON(text){
  var blocks=(text||'').match(/```json\s*([\s\S]*?)```/g);if(!blocks)return null;
  var out=[];blocks.forEach(function(b){var body=b.replace(/```json\s*/,'').replace(/```/,'').trim();try{var arr=JSON.parse(body);if(Array.isArray(arr))out=out.concat(arr);}catch(e){}});
  return out.length?out:null;
}
function tryImportQuizJSON(){
  var all=[];curMsgs().forEach(function(m){if(m.role==='assistant'){var q=extractQuizJSON(m.content);if(q)all=all.concat(q);}});
  if(!all.length)return;
  state.vocab._lastQuiz=all;
  var badge=document.getElementById('vocabQuizBadge');
  if(badge){badge.style.display='inline-block';badge.textContent='✅ 本卷已结构化解析 '+all.length+' 题';}
}

async function sendMsg(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text||state.isLoading)return;
  input.value='';input.style.height='auto';
  document.getElementById('sendBtn').disabled=true;state.isLoading=true;

  // Collapse config
  const cfg=document.getElementById('mpConfig');if(cfg)cfg.style.maxHeight='0';

  addMsg('user',text);

  let ctx='【重要规则】1.禁止生成依赖图片的题目 2.知识严格模式：仅基于教材和真题知识库回答，不存在的内容请明确说"当前知识库暂无该内容"，禁止编造。\n';
  if(state.difficulty)ctx+='[难度：'+state.difficulty+']\n';
  if(ctx)ctx+='\n';

  const userContent=ctx+text;
  const allMsgs=curMsgs();
  const apiMsgs=[];
  for(let i=Math.max(0,allMsgs.length-11);i<allMsgs.length-1;i++){
    if(!allMsgs[i].streaming)apiMsgs.push({role:allMsgs[i].role,content:allMsgs[i].content});
  }
  apiMsgs.push({role:'user',content:userContent});

  addMsg('assistant','',true);

  try{
    const resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,agent:state.agent})});
    if(!resp.ok){const err=await resp.json().catch(()=>({error:'HTTP '+resp.status}));throw new Error(err.error||'请求失败')}
    const reader=resp.body.getReader();const decoder=new TextDecoder();let full='',buf='';
    while(true){
      const{done,value}=await reader.read();if(done)break;
      buf+=decoder.decode(value,{stream:true});
      const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){
        if(line.startsWith('data: ')){
          try{const d=JSON.parse(line.slice(6));if(d.type==='text'){full+=d.text;addMsg('assistant',full,true)}}catch(e){}
        }
      }
    }
    finishStreaming();
    const conv=curConv();if(conv&&conv.messages.length>0)conv.title=convTitle(conv.messages);
    dbg('✅ 生成完成 ('+full.length+' 字)','ok');
    renderConvList();saveAll();
  }catch(e){
    finishStreaming();
    dbg('❌ 错误: '+e.message,'err');
    const msgs=curMsgs();
    let em=e.message||'未知错误';
    if(em.includes('Failed to fetch'))em='无法连接服务器，请确认已运行 node server.js';
    if(msgs.length>0)msgs[msgs.length-1]={role:'assistant',content:'❌ 出错了：'+em,streaming:false};
    else msgs.push({role:'assistant',content:'❌ 出错了：'+em,streaming:false});
    renderMsgs();saveAll();
  }finally{
    state.isLoading=false;
    document.getElementById('sendBtn').disabled=false;
    document.getElementById('userInput').focus();
  }
}

(function(){
  const sidebar=document.getElementById('sidebar');
  const resizer=document.getElementById('sbResizer');
  let dragging=false,startX=0,startW=0;
  const saved=localStorage.getItem('nav_w');
  if(saved&&sidebar){sidebar.style.width=saved+'px';document.documentElement.style.setProperty('--nav-w',saved+'px')}
  resizer.addEventListener('mousedown',function(e){
    dragging=true;startX=e.clientX;startW=sidebar.offsetWidth;
    resizer.classList.add('dragging');document.body.style.cursor='col-resize';document.body.style.userSelect='none';
    e.preventDefault();
  });
  document.addEventListener('mousemove',function(e){
    if(!dragging)return;
    let w=startW+(e.clientX-startX);
    w=Math.max(240,Math.min(400,w));
    sidebar.style.width=w+'px';document.documentElement.style.setProperty('--nav-w',w+'px');
  });
  document.addEventListener('mouseup',function(){
    if(!dragging)return;dragging=false;
    resizer.classList.remove('dragging');document.body.style.cursor='';document.body.style.userSelect='';
    localStorage.setItem('nav_w',sidebar.offsetWidth);
  });
})();

// MOBILE APP V5 — Hash Router + Isolated Agent Stores
// ═══════════════════════════════════════
var M={ // Mobile App Namespace
  // Router state
  _route:'home',_agent:null,_loading:false,_sheetData:null,
  // Agent stores (ISOLATED per agent — no cross-contamination)
  stores:{},
  // Student data cache
  _students:null,

  // ═══════ INIT ═══════
  init:function(){
    if(window.innerWidth>767)return;
    // Load agent stores from localStorage
    M._loadStores();
    // Render bottom nav
    M._renderNav();
    // Route to current hash or default home
    var hash=window.location.hash.replace('#/','')||'home';
    M.navigate(hash,true);
    // Listen for hash changes
    window.addEventListener('hashchange',function(){
      var h=window.location.hash.replace('#/','')||'home';
      M.navigate(h,true);
    });
    // Resize handler
    var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){
      if(window.innerWidth>767&&document.getElementById('mobile-app').style.display!=='none'){location.reload()}
      if(window.innerWidth<=767){M._renderNav()}
    },300)});
    console.log('📱 Melix Mobile V5 initialized');
  },

  // ═══════ STORE MANAGEMENT ═══════
  _loadStores:function(){
    var agents=['grammar','exam','writing','vocabulary'];
    agents.forEach(function(a){
      try{
        var raw=localStorage.getItem('melix_'+a);
        M.stores[a]=raw?JSON.parse(raw):{conversations:[],activeConvId:null,config:{}};
      }catch(e){M.stores[a]={conversations:[],activeConvId:null,config:{}}}
    });
    // Load shared app state
    try{
      var appRaw=localStorage.getItem('melix_app');
      M.appState=appRaw?JSON.parse(appRaw):{student:'',difficulty:'',teaching:{stage:'',publisher:'',grade:'',semester:'',unit:''}};
    }catch(e){M.appState={student:'',difficulty:'',teaching:{stage:'',publisher:'',grade:'',semester:'',unit:''}}}
  },
  _saveStore:function(agentId){
    try{localStorage.setItem('melix_'+agentId,JSON.stringify(M.stores[agentId]))}catch(e){}
    try{localStorage.setItem('melix_app',JSON.stringify(M.appState))}catch(e){}
  },
  _curStore:function(){
    if(!M._agent)return null;
    return M.stores[M._agent];
  },
  _curConv:function(){
    var s=M._curStore();if(!s)return null;
    if(!s.conversations)s.conversations=[];
    if(s.activeConvId){
      var c=s.conversations.find(function(x){return x.id===s.activeConvId});

  // ═══════ AGENT SEND MESSAGE ═══════
  _sendMsg:async function(){
    var input=document.getElementById('mChatInput');if(!input)return;
    var text=input.value.trim();if(!text||M._loading)return;
    input.value='';input.style.height='auto';M._loading=true;
    var btn=document.getElementById('mChatSend');if(btn)btn.disabled=true;

    // Ensure active conversation
    var store=M._curStore();if(!store)return;
    if(!store.conversations)store.conversations=[];
    if(!store.activeConvId){
      var newId=M._agent+'_'+Date.now();
      store.conversations.unshift({id:newId,agent:M._agent,title:'新会话',messages:[],createdAt:Date.now()});
      store.activeConvId=newId;
    }
    var conv=M._curConv();if(!conv)return;

    // Build context
    var ctx='';
    if(M.appState.difficulty)ctx+='[难度：'+M.appState.difficulty+'] ';
    if(M.appState.student==='nandy')ctx+='[学生：Nandy，昌平区六年级小升初] ';
    else if(M.appState.student==='yiyi')ctx+='[学生：熠熠，海淀区初一，初二提前学] ';

    // Add user message
    var userContent=ctx+text;
    conv.messages.push({role:'user',content:userContent});
    conv.messages.push({role:'assistant',content:'',streaming:true});
    M._renderChat();M._saveStore(M._agent);

    // Build API messages
    var apiMsgs=[];
    for(var i=Math.max(0,conv.messages.length-13);i<conv.messages.length-1;i++){
      if(!conv.messages[i].streaming)apiMsgs.push({role:conv.messages[i].role,content:conv.messages[i].content});
    }

    try{
      var resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:apiMsgs,agent:M._agent})});
      if(!resp.ok){var err=await resp.json().catch(function(){return{error:'HTTP '+resp.status}});throw new Error(err.error||'请求失败')}
      var reader=resp.body.getReader();var decoder=new TextDecoder();var full='',buf='';
      while(true){var d=await reader.read();if(d.done)break;buf+=decoder.decode(d.value,{stream:true});var lines=buf.split('\n');buf=lines.pop()||'';
        lines.forEach(function(l){if(l.startsWith('data: ')){try{var p=JSON.parse(l.slice(6));if(p.type==='text'){full+=p.text;conv.messages[conv.messages.length-1].content=full;M._renderChat()}}catch(e){}}});
      }
      conv.messages[conv.messages.length-1].streaming=false;
      conv.title=M._convTitle(conv.messages);
      M._renderChat();M._saveStore(M._agent);
    }catch(e){
      conv.messages[conv.messages.length-1]={role:'assistant',content:'❌ 出错了：'+(e.message||'未知错误'),streaming:false};
      M._renderChat();M._saveStore(M._agent);
    }finally{
      M._loading=false;if(btn)btn.disabled=false;var inp=document.getElementById('mChatInput');if(inp)inp.focus();
    }
  },

    }
    var inp=document.getElementById('mChatInput');if(inp)inp.value=msg;
    var cfg=document.getElementById('mAgentConfig');if(cfg)cfg.style.display='none';

  // ═══════ MARKDOWN RENDERER ═══════
  _md:function(text){
    if(!text)return'';
    var h=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h=h.replace(/```(\w*)\n?([\s\S]*?)```/g,'<pre><code>$2</code></pre>');
    h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
    h=h.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    h=h.replace(/\*([^*]+)\*/g,'<em>$1</em>');
    h=h.replace(/^###\s(.+)$/gm,'<h3>$1</h3>');
    h=h.replace(/^##\s(.+)$/gm,'<h2>$1</h2>');
    h=h.replace(/^#\s(.+)$/gm,'<h1>$1</h1>');
    h=h.replace(/^&gt;\s?(.*)$/gm,'<blockquote>$1</blockquote>');
    h=h.replace(/((?:^\|.+\|\n?)+)/gm,function(m){
      var lines=m.trim().split('\n');if(lines.length<2)return m;
      var html='<table>';lines.forEach(function(line,i){
        var cells=line.split('|').filter(function(_,j,arr){return j>0&&j<arr.length-1}).map(function(c){return c.trim()});
        if(i===0)html+='<thead><tr>'+cells.map(function(c){return'<th>'+c+'</th>'}).join('')+'</tr></thead>';
        else if(i===1&&cells.every(function(c){return/^[-: ]+$/.test(c)}))html+='<tbody>';
        else html+='<tr>'+cells.map(function(c){return'<td>'+c+'</td>'}).join('')+'</tr>';
      });
      html+='</tbody></table>';return html;
    });
    h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
    h=h.replace(/((?:<li>.*<\/li>\s*)+)/g,'<ul>$1</ul>');
    h=h.replace(/<\/ul>\s*<ul>/g,'');
    h=h.replace(/\n\n/g,'</p><p>');
    h=h.replace(/\n/g,'<br>');
    h='<p>'+h+'</p>';
    h=h.replace(/<p>\s*<\/p>/g,'');
    return h;
  },
  _convTitle:function(msgs){
    if(!msgs||!msgs.length)return'新会话';
    for(var i=0;i<msgs.length;i++){if(msgs[i].role==='user'){
      var t=msgs[i].content.replace(/【[^】]*】/g,'').trim();
      t=t.replace(/^你是[^。]{2,30}。/,'').replace(/^请/,'').trim();
      t=t.split(/[\n。]/)[0].trim();
      if(t.length>20)t=t.slice(0,20)+'…';
      return t||'新会话';
    }}
    return'新会话';
  }
};

loadAll();

updateDifficulty();
// V4.2: Always start fresh — create new empty conversation for every agent on startup
// History is preserved in conversations[] but never auto-activated
// Cap conversations per agent to prevent localStorage overflow (5MB limit)
var MAX_CONVS_PER_AGENT=20;
Object.keys(state.sessions).forEach(agent=>{
  const s=state.sessions[agent];
  // Trim old conversations if exceeding cap
  if(s.conversations && s.conversations.length>MAX_CONVS_PER_AGENT){
    // Keep most recent ones (sort by createdAt descending, keep the newest)
    s.conversations.sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)});
    s.conversations=s.conversations.slice(0,MAX_CONVS_PER_AGENT);
  }
  const pfx=(AGENT_PREFIX[agent]||'conv')+'_';
  const newId=pfx+Date.now();
  s.conversations.push({id:newId,agent:agent,title:'新会话',messages:[],createdAt:Date.now()});
  s.activeConvId=newId;
  if(agent==='grammar')s.selected=[];
  if(agent==='grade'){s.uploadedFile=null;s.ocrText='';}
  if(agent==='writing'){s.writeType='';s.writeAction='';}
  if(agent==='exam'){s.examType='';}
});
